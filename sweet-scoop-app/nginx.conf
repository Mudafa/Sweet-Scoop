server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls: /api/flavors -> http://backend:5000/flavors
    # "backend" is the Docker Compose service name and the Kubernetes Service name.
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router: unknown paths (/flavors, /login, ...) fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
