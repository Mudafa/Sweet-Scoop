# Sweet Scoop — local run + Selenium tests
#
#   Run the app:     docker compose up -d --build              -> http://localhost
#   Run the tests:   docker compose --profile test run --rm tests
#   Stop:            docker compose --profile test down
#
# Image names match the Docker Hub repos Jenkins pushes to. Override the tag with
#   IMAGE_TAG=42 docker compose ...

services:
  backend:
    build: ./backend
    image: ${DOCKERHUB_USER:-madiiha}/sweet-scoop-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./sweet-scoop-app
    image: ${DOCKERHUB_USER:-madiiha}/sweet-scoop-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  # ---- only started with --profile test ----
  selenium:
    image: selenium/standalone-chrome:latest
    profiles: ["test"]
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  tests:
    build: ./tests
    profiles: ["test"]
    environment:
      SWEET_SCOOP_URL: http://frontend
      SELENIUM_REMOTE_URL: http://selenium:4444
      HEADLESS: "1"
    depends_on:
      frontend:
        condition: service_started
      selenium:
        condition: service_healthy
