---
# Stage 6 — connect to the Terraform-created server and install Docker + Kubernetes (k3s).
- hosts: app
  become: true
  gather_facts: false
  name: Configure Sweet Scoop deployment server
  tasks:
    - name: Wait until the new EC2 instance accepts SSH
      wait_for_connection:
        timeout: 300

    - name: Gather facts
      setup:

    - name: Wait for cloud-init to finish (frees the apt lock)
      command: cloud-init status --wait
      changed_when: false

    - name: Install Docker and helpers
      apt:
        name: [docker.io, curl]
        update_cache: true
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    # k3s = lightweight, certified Kubernetes. Traefik is disabled so it doesn't
    # take port 80, which the plain Docker container (stage 7) uses.
    - name: Install k3s (Kubernetes)
      shell: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik --write-kubeconfig-mode 644" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for the Kubernetes node to be Ready
      command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
      changed_when: false

    - name: Show versions
      shell: docker --version && k3s kubectl version && k3s kubectl get nodes -o wide
      register: versions
      changed_when: false

    - debug:
        msg: "{{ versions.stdout_lines }}"
